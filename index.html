<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Shared and lazy Arc CSS chunks must follow the same cascade order. -->
    <style>@layer theme, base, components, utilities;</style>
    <!-- Until the stylesheet loads, the theme background (the stylesheet turns it transparent when
         the window glass is on). The main window stays hidden until its first ready paint (ADR-098). -->
    <style>@layer base { body { margin: 0; background: #0c0c0c; } @media (prefers-color-scheme: light) { body { background: #f4f4f5; } } }</style>
    <link rel="icon" type="image/svg+xml" href="/sirus.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <!-- Home-screen app when the Mac serves this page to a phone (ADR-081). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sirus" />
    <meta name="theme-color" content="#0c0c0c" />
    <title>Sirus Code</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
