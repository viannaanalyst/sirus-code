# Windows port: check that the desktop app compiles for Windows on every change
# to the back end, and build the installer (NSIS .exe) on demand. The headless
# host (`sirus-host`, ADR-131) is not built for Windows: it is a server for
# Linux and macOS, and its control socket is a Unix socket.
name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/windows.yml"

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Plain logs, so the summary's error count can match the lines.
  CARGO_TERM_COLOR: never

jobs:
  check:
    name: cargo check (desktop)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: check

      # Tauri embeds the built front end at compile time.
      - name: Build the front end
        run: |
          npm ci
          npm run build

      - name: cargo check
        working-directory: src-tauri
        run: |
          set +e
          cargo check --all-targets --message-format short 2>&1 | tee ../check-desktop.log
          status=${PIPESTATUS[0]}
          errors=$(grep -c ': error' ../check-desktop.log)
          warnings=$(grep -c ': warning' ../check-desktop.log)
          {
            echo "### Windows · desktop"
            echo ""
            echo "- errors: $errors"
            echo "- warnings: $warnings"
            echo ""
            echo '```'
            grep ': error' ../check-desktop.log | sort | uniq | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-check-desktop
          path: check-desktop.log

  installer:
    name: installer (.exe)
    # About half an hour on the runner: only when started by hand.
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: installer

      - name: Install dependencies
        run: npm ci

      # Unsigned for now: Windows SmartScreen warns on the first launch.
      - name: Build the installer
        run: npx tauri build --bundles nsis --ci

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: sirus-code-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
