<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Switchyard · Composer metal</title>
  </head>
  <body>
    <header class="preview-header">
      <a class="ui-brand" href="#composer"><img src="/switchyard.svg" alt="" />Switchyard <span class="ui-caption">/ composer preview</span></a>
      <button id="pause" class="preview-control ui-control" type="button" aria-pressed="false">Pausar efeito</button>
    </header>
    <main>
      <div class="stage">
        <div class="intro"><p class="ui-caption">METAL EM MOVIMENTO</p><h1 class="ui-title">O mesmo metal do botão +.</h1><p class="ui-body">Reflexos líquidos percorrem a borda. Ao digitar, o movimento para.</p></div>
        <div class="workspace ui-caption" aria-label="Contexto ilustrativo da nova conversa">
          <span><i data-icon="folder"></i>Switchyard<i data-icon="chevron"></i></span>
          <span><i data-icon="monitor"></i>Local<i data-icon="chevron"></i></span>
          <span><i data-icon="branch"></i>main<i data-icon="chevron"></i></span>
        </div>
        <form class="agent-composer" id="composer">
          <span class="composer-contour" aria-hidden="true"></span>
          <textarea id="prompt" class="ui-chat" rows="2" aria-label="Mensagem de demonstração" placeholder="O que vamos construir?" spellcheck="false"></textarea>
          <div class="composer-footer">
            <div class="footer-group">
              <button type="button" id="add" class="composer-control composer-icon-control composer-metal-button" aria-label="Adicionar contexto de demonstração" aria-expanded="false"><span class="composer-metal-surface" aria-hidden="true"></span><span class="composer-metal-core" aria-hidden="true"></span><i data-icon="plus"></i></button>
              <button type="button" id="approval" class="composer-control text-control ui-control" aria-label="Alternar aprovação ilustrativa"><i data-icon="hand"></i><span>Solicitar aprovação</span><i data-icon="chevron"></i></button>
            </div>
            <div class="footer-group">
              <button type="button" id="model" class="composer-control text-control ui-control" aria-label="Alternar modelo ilustrativo"><img src="/src/assets/providers/claude.png" alt="" /><span>Opus 5</span><i data-icon="chevron"></i></button>
              <button type="submit" id="send" class="composer-control composer-icon-control send" disabled aria-label="Simular envio"><i data-icon="up"></i></button>
            </div>
          </div>
          <div id="add-menu" class="add-menu" hidden><p class="ui-caption">Adicionar ao preview</p><button type="button" class="ui-control" id="context"><i data-icon="folder"></i>Contexto de exemplo</button></div>
        </form>
        <div class="preview-options ui-caption">
          <span id="status" role="status">Prévia visual · envio simulado</span>
          <div class="speed-control">
            <span aria-hidden="true">Velocidade</span>
            <fieldset class="speed-pill ui-control">
              <legend class="sr-only">Velocidade da animação</legend>
              <label><input type="radio" name="speed" value="1" checked /><span>Lenta</span></label>
              <label><input type="radio" name="speed" value="2" /><span>Suave</span></label>
              <label><input type="radio" name="speed" value="3" /><span>Rápida</span></label>
            </fieldset>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
